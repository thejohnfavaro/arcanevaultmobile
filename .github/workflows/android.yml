name: Android Debug APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - uses: gradle/actions/setup-gradle@v4
      - name: JavaScript regression checks
        run: |
          node tests/regression.mjs
          node tests/new-features.mjs
          node tests/mobile-parity.mjs
      - name: Test printing-aware ownership contract
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: bash ./gradlew --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneVault-Android-2.0.26-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Signed production builds are published only by android-release.yml,
      # which checks the persistent signing certificate and versioned notes.
      # Never publish an unrelated debug-signed APK as an update.
