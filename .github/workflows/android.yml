name: Android Debug APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - uses: gradle/actions/setup-gradle@v4
      - name: JavaScript regression checks
        run: |
          node tests/regression.mjs
          node tests/new-features.mjs
          node tests/mobile-parity.mjs
          node tests/native-updater.mjs
          node tests/native-catalog.mjs
          node tests/native-printings.mjs
          node tests/native-visual.mjs
          node tests/native-collection-sources.mjs
          node tests/native-owned-printings.mjs
          node tests/native-workspace.mjs
          node tests/native-peer-sync.mjs
          node tests/native-window-insets.mjs
          node tests/native-wireless-peer.mjs
          node tests/native-set-filters-qr.mjs
          node tests/native-peer-apply.mjs
          node tests/native-wireless-apply.mjs
          node tests/native-usb-peer.mjs
          node tests/native-auto-baseline.mjs
          node tests/native-card-browsing.mjs
          node tests/native-inline-card-inspector.mjs
          node tests/native-cross-platform-parity.mjs
          node tests/native-update-retention-and-artwork.mjs
          node tests/native-commander-deck-handoff.mjs
          node tests/native-scrollbar-theme.mjs
          node tests/native-first-usb-sync.mjs
          node tests/native-deck-cover-art.mjs
          node tests/native-qol-parity.mjs
          node tests/native-artwork-quality-shortlist.mjs
          node tests/native-system-back.mjs
          node tests/native-home-widgets.mjs
      - name: Test printing-aware ownership contract
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: bash ./gradlew --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneVault-Android-2.1.5-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Signed production builds are published only by android-release.yml,
      # which checks the persistent signing certificate and versioned notes.
      # Never publish an unrelated debug-signed APK as an update.
